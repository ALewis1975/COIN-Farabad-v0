name: Fix PR E prison comments once

on:
  push:
    branches:
      - data/prison-anchor-correction-pr-e

permissions:
  contents: write

jobs:
  fix-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update stale contractor comment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/farabad_site_templates.sqf')
          s = p.read_text(encoding='utf-8')
          old = '    //     contractor  (2-4)   Outer maintenance / perimeter support (no anchor)\n'
          new = '    //     contractor  (2-4)   Entry/admin service support\n'
          if old not in s:
              raise SystemExit('expected contractor comment not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit comment fix and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-e-comment-fix-once.yml
          git add data/farabad_site_templates.sqf
          git commit -m "docs: update prison contractor anchor comment"
          git push origin HEAD:${{ github.ref_name }}
