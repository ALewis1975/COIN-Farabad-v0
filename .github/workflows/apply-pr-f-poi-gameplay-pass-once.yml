name: Apply PR F POI gameplay pass once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-pr-f:
    if: github.head_ref == 'data/poi-gameplay-pass-pr-f'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply PR F catalog patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('data/incident_markers.sqf')
          s = p.read_text(encoding='utf-8')

          old_mosque = '    ["ARC_loc_GrandMosque", "IED: Suspicious Package at Mosque", "IED"],\n\n'
          new_mosque = (
              '    ["ARC_loc_GrandMosque", "IED: Suspicious Package at Mosque", "IED"],\n'
              '    ["ARC_loc_GrandMosqueOuterCordon", "Checkpoint: TNP Cordon at Grand Mosque", "CHECKPOINT"],\n'
              '    ["ARC_loc_GrandMosqueVendorStrip", "Civil: Vendor Dispute at Mosque Market Edge", "CIVIL"],\n\n'
          )
          if old_mosque not in s:
              raise SystemExit('Grand Mosque insertion point not found')
          s = s.replace(old_mosque, new_mosque, 1)

          old_hotel = '    ["ARC_loc_BelleFoilleHotel", "QRF: Hotel Distress Call", "QRF"],\n\n'
          new_hotel = (
              '    ["ARC_loc_BelleFoilleHotel", "QRF: Hotel Distress Call", "QRF"],\n'
              '    ["ARC_loc_BelleFoilleHotelSecurityPost", "Civil: Hotel Security Interview", "CIVIL"],\n\n'
          )
          if old_hotel not in s:
              raise SystemExit('Belle Foille Hotel insertion point not found')
          s = s.replace(old_hotel, new_hotel, 1)

          old_prison = '    ["ARC_loc_KarkanakPrison", "Patrol: Prison Outer Ring", "PATROL"],\n\n'
          new_prison = (
              '    ["ARC_loc_KarkanakPrison", "Patrol: Prison Outer Ring", "PATROL"],\n'
              '    ["prison_entry_office", "Escort: EPW Handoff at Karkanak Prison", "ESCORT"],\n\n'
          )
          if old_prison not in s:
              raise SystemExit('Karkanak Prison insertion point not found')
          s = s.replace(old_prison, new_prison, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Add PR F QA note
        run: |
          cat > docs/qa/POI_Gameplay_Pass_PR_F_2026-07-02.md <<'EOF'
          # PR F POI Gameplay Pass

          Status: catalog-only first gameplay pass using corrected POI anchors.

          ## Scope

          This PR adds small POI-driven incident catalog entries that target the corrected Grand Mosque, Belle Foille Hotel, and Karkanak Prison anchors.

          ## Added incidents

          Grand Mosque:
          - `Checkpoint: TNP Cordon at Grand Mosque` at `ARC_loc_GrandMosqueOuterCordon`
          - `Civil: Vendor Dispute at Mosque Market Edge` at `ARC_loc_GrandMosqueVendorStrip`

          Belle Foille Hotel:
          - `Civil: Hotel Security Interview` at `ARC_loc_BelleFoilleHotelSecurityPost`

          Karkanak Prison:
          - `Escort: EPW Handoff at Karkanak Prison` at `prison_entry_office`

          ## Boundaries

          No `mission.sqm` edits.
          No new task engine logic.
          No persistence changes.
          No CIVSUB, SitePop engine, AIRBASE, Threat, or UI changes.
          No ambient population count changes.

          ## Why these tasks

          These entries exercise the corrected anchors from PR D and PR E without adding a new subsystem. They should produce more believable task locations around the mosque/hotel/prison micro-zones while continuing to use the existing incident generation path.

          ## Dedicated MP smoke test

          1. Start dedicated server and confirm no RPT compile errors from `data/incident_markers.sqf`.
          2. Generate incidents until one of the new POI rows appears, or temporarily force-select a row in a local test build.
          3. Confirm each marker resolves through `ARC_fnc_worldResolveMarker` / `allMapMarkers`:
             - `ARC_loc_GrandMosqueOuterCordon`
             - `ARC_loc_GrandMosqueVendorStrip`
             - `ARC_loc_BelleFoilleHotelSecurityPost`
             - `prison_entry_office`
          4. Accept a task and confirm route/local support behavior remains normal.
          5. JIP a second client during an active task and confirm task state is visible and no duplicate task is generated.

          ## Regression risk

          Low. This is a catalog-only gameplay pass. Main risk is task weighting/frequency, since the incident catalog has more candidates at these POIs.
          EOF

      - name: Static sanity checks
        run: |
          python3 scripts/dev/sqflint_compat_scan.py --strict data/incident_markers.sqf
          python3 tools/generate_marker_index.py

      - name: Commit PR F changes and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/apply-pr-f-poi-gameplay-pass-once.yml
          git add data/incident_markers.sqf docs/qa/POI_Gameplay_Pass_PR_F_2026-07-02.md docs/reference/marker-index.md docs/reference/marker-index.json

          git commit -m "data: add POI gameplay incident entries"
          git push origin HEAD:${{ github.head_ref }}
